[project]
name = "aiwatch"
version = "0.1.0"
description = "Local-first LLM usage and cost tracking: SDK instrumentation, CLI and dashboard"
readme = "README.md"
authors = [
    { name = "Chaitanya Mhetre", email = "mhetrechaitanya06@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "openai", "anthropic", "gemini", "cost", "observability", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
openai = ["openai>=3.0"]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=2.0"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=1.8.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "openai>=3.19.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
aiwatch = "aiwatch.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
